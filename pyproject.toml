[project]
name = "mcp-commands"
version = "0.1.0"
description = "MCP servers shaped like a CLI: a command tree behind two tools, help and run"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tane van Wifferen" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "cli", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/tanevanwifferen/mcp-commands-python"
Issues = "https://github.com/tanevanwifferen/mcp-commands-python/issues"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
]
